<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Control - Arriendos San Pablo</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .swal2-container {
            z-index: 999999 !important;
        }
        tr.row-oculta,
        tr.row-oculta td,
        tr.row-oculta input,
        tr.row-oculta select,
        tr.row-oculta span:not(.no-strike),
        tr.row-oculta div:not(.no-strike) {
            text-decoration: line-through !important;
            opacity: 0.55 !important;
            color: #64748b !important;
        }
        tr.row-oculta select,
        tr.row-oculta input {
            background-color: #fef3c7 !important;
            border-color: #fcd34d !important;
        }
        .btn-action-no-strike,
        .btn-action-no-strike * {
            text-decoration: none !important;
            opacity: 1 !important;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        accent: '#3b82f6',
                    }
                }
            }
        }
    </script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS (Excel Engine) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <!-- Dexie.js (IndexedDB Engine) -->
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    
    <!-- Firebase App & Firestore SDKs (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- html2pdf.js (PDF Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Immediate Vendor Mode Detection -->
    <script>
        (function() {
            var fullUrl = (window.location.href + ' ' + window.location.hash + ' ' + window.location.search).toLowerCase();
            if (fullUrl.indexOf('modo=vendedor') !== -1 || fullUrl.indexOf('vendedor=true') !== -1 || window.location.hash.indexOf('pizarra-vendedor') !== -1) {
                document.documentElement.classList.add('vendor-mode-active');
                window._isVendorModeDirect = true;
            }
        })();
    </script>
    <style>
        html.vendor-mode-active #sidebar,
        body.vendor-mode #sidebar {
            display: none !important;
            width: 0 !important;
            max-width: 0 !important;
            min-width: 0 !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Strict Layout & Flexbox Overflow Protection */
        html, body {
            width: 100% !important;
            height: 100% !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            overflow: hidden !important;
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }

        #sidebar {
            width: 260px !important;
            min-width: 260px !important;
            max-width: 260px !important;
            flex-shrink: 0 !important;
            overflow-x: hidden !important;
            box-sizing: border-box !important;
        }

        #sidebar.collapsed {
            width: 76px !important;
            min-width: 76px !important;
            max-width: 76px !important;
        }

        #sidebar.collapsed .sidebar-text,
        #sidebar.collapsed h2,
        #sidebar.collapsed span.sidebar-text,
        #sidebar.collapsed div.sidebar-text,
        #sidebar.collapsed p.sidebar-text {
            display: none !important;
            visibility: hidden !important;
            width: 0 !important;
            max-width: 0 !important;
            height: 0 !important;
            overflow: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        #sidebar.collapsed .p-5 {
            padding-left: 0.5rem !important;
            padding-right: 0.5rem !important;
            justify-content: center !important;
        }

        #sidebar.collapsed .p-5 > div {
            justify-content: center !important;
            width: 100% !important;
        }

        #sidebar.collapsed .nav-btn {
            justify-content: center !important;
            align-items: center !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
            gap: 0 !important;
            width: 100% !important;
            text-align: center !important;
        }

        #sidebar.collapsed .nav-btn i,
        #sidebar.collapsed .nav-btn svg {
            margin: 0 auto !important;
            flex-shrink: 0 !important;
        }

        #app-container {
            flex: 1 1 0% !important;
            min-width: 0 !important;
            max-width: 100% !important;
            overflow: hidden !important;
            box-sizing: border-box !important;
        }
    </style>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css?v=6.2.75">
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 text-slate-200 min-h-screen flex overflow-hidden font-sans">
    
    <!-- Sidebar -->
    <aside id="sidebar" class="w-[260px] flex-shrink-0 glass-panel border-r border-white/10 flex flex-col z-20 transition-all duration-300 ease-in-out relative overflow-x-hidden">
        <!-- Logo & Sidebar Toggle -->
        <div class="p-5 flex items-center justify-between border-b border-white/10 overflow-hidden">
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="bg-blue-500/20 p-2.5 rounded-xl border border-blue-500/30 text-blue-400 flex-shrink-0">
                    <i data-lucide="truck" class="w-6 h-6"></i>
                </div>
                <div class="sidebar-text whitespace-nowrap overflow-hidden">
                    <h1 class="text-sm font-bold leading-tight text-white tracking-wide">Software Control</h1>
                    <p class="text-xs text-blue-400 font-medium">Arriendos San Pablo</p>
                </div>
            </div>
            <button id="btn-toggle-sidebar" class="sidebar-text p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-colors flex-shrink-0" title="Colapsar menú lateral">
                <i data-lucide="panel-left-close" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto py-6 px-3.5 space-y-7 custom-scrollbar">
            
            <!-- General -->
            <div>
                <h2 class="sidebar-text text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-3 px-3 whitespace-nowrap">General</h2>
                <ul class="space-y-1.5">
                    <li>
                        <button onclick="window.app.navigateTo('carga-datos')" class="nav-btn active flex items-center w-full gap-3.5 px-3 py-2.5 rounded-xl text-sm font-medium transition-all group relative" data-page="carga-datos" title="Carga de Datos">
                            <i data-lucide="upload-cloud" class="w-5 h-5 flex-shrink-0"></i>
                            <span class="sidebar-text whitespace-nowrap">Carga de Datos</span>
                        </button>
                    </li>
                </ul>
            </div>

            <!-- Módulo 1 -->
            <div>
                <h2 class="sidebar-text text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-3 px-3 whitespace-nowrap">Módulo 1 — Programación</h2>
                <ul class="space-y-1.5">
                    <li>
                        <button onclick="window.app.navigateTo('pizarra')" class="nav-btn flex items-center w-full gap-3.5 px-3 py-2.5 rounded-xl text-sm font-medium transition-all group relative" data-page="pizarra" title="Pizarra de Servicios">
                            <i data-lucide="layout-dashboard" class="w-5 h-5 flex-shrink-0"></i>
                            <span class="sidebar-text whitespace-nowrap">Pizarra de Servicios</span>
                        </button>
                    </li>
                </ul>
            </div>

            <!-- Módulo 2 — Informe Término de Servicio -->
            <div>
                <h2 class="sidebar-text text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-3 px-3 whitespace-nowrap">Módulo 2 — Informe Término Servicio</h2>
                <ul class="space-y-1.5">
                    <li>
                        <button onclick="window.app.navigateTo('viaticos')" class="nav-btn flex items-center w-full gap-3.5 px-3 py-2.5 rounded-xl text-sm font-medium transition-all group relative" data-page="viaticos" title="Informe Término de Servicio">
                            <i data-lucide="file-check-2" class="w-5 h-5 flex-shrink-0 text-emerald-400"></i>
                            <span class="sidebar-text whitespace-nowrap">Informe Término Servicio</span>
                        </button>
                    </li>
                </ul>
            </div>

        </nav>

        <!-- Connection Status Indicator -->
        <div class="p-3 border-t border-white/5 mx-2 mb-1">
            <div id="firebase-status-indicator" class="flex items-center gap-2 px-2 py-1 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-xs">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="sidebar-text text-emerald-300 font-mono text-[11px] truncate">Nube: Conectado</span>
            </div>
        </div>

        <!-- Footer -->
        <div class="p-4 border-t border-white/10 flex items-center justify-between text-xs text-slate-500 overflow-hidden">
            <span class="sidebar-text font-mono">v6.2.323</span>
            <span id="storage-mode-indicator" class="flex items-center gap-1.5 text-emerald-400" title="Base de Datos Activa">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse flex-shrink-0"></span>
                <span class="sidebar-text whitespace-nowrap font-medium">Sistema Listo</span>
            </span>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="app-container" class="flex-1 flex flex-col h-screen overflow-hidden relative min-w-0">
        <!-- Top Header Bar -->
        <header class="h-16 border-b border-white/10 flex items-center justify-between px-6 bg-slate-900/60 backdrop-blur-md sticky top-0 z-30 flex-shrink-0">
            <div class="flex items-center gap-3">
                <button id="sidebar-toggle-btn" class="btn-header-toggle-sidebar p-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition-colors flex items-center justify-center" title="Contraer/Expandir Barra Lateral">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div class="p-2 bg-blue-500/10 rounded-xl text-blue-400 border border-blue-500/20 hidden sm:flex">
                    <i data-lucide="layout" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 id="header-title" class="text-base sm:text-lg font-bold text-white tracking-wide">Pizarra de Servicios</h1>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- User Profile / PIN Login Container (hidden) -->
                <div id="user-profile-header-container" class="hidden"></div>

                <!-- Notification Bell Container -->
                <div class="relative inline-block text-left" id="header-notifications-container">
                    <button type="button" id="btn-toggle-notifications" onclick="window.app.toggleNotificationsMenu(event)" class="p-2 bg-slate-800/90 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl border border-white/10 shadow-sm transition-all flex items-center justify-center relative cursor-pointer" title="Centro de Notificaciones y Alertas Web">
                        <i data-lucide="bell" class="w-4 h-4 text-amber-400"></i>
                        <span id="notif-badge-count" class="hidden absolute -top-1 -right-1 bg-rose-600 text-white font-mono font-bold text-[9px] w-4 h-4 rounded-full flex items-center justify-center border border-white shadow">0</span>
                    </button>
                    <div id="menu-notifications-dropdown" class="hidden absolute right-0 mt-2 w-80 sm:w-96 rounded-2xl bg-slate-900/95 border border-white/20 shadow-2xl z-[85] overflow-hidden py-2 backdrop-blur-2xl animate-in fade-in zoom-in-95 duration-150">
                        <div class="px-3.5 py-2 border-b border-white/10 flex items-center justify-between">
                            <p class="text-xs font-bold uppercase tracking-wider text-white flex items-center gap-1.5">
                                <i data-lucide="bell-ring" class="w-4 h-4 text-amber-400"></i> Alertas de Agendamiento
                            </p>
                            <button onclick="window.app.markNotificationsRead()" class="text-[10px] text-blue-400 hover:text-blue-300 font-semibold underline">Marcar leídas</button>
                        </div>
                        <div id="notif-list-container" class="max-h-72 overflow-y-auto custom-scrollbar p-2 space-y-1.5">
                            <div class="text-center py-6 text-slate-400 text-xs">Sin notificaciones pendientes</div>
                        </div>
                    </div>
                </div>

                <div id="header-date" class="text-xs text-slate-300 font-semibold border-l border-white/10 pl-3">
                    <!-- Current Date -->
                </div>
            </div>
        </header>

        <!-- Dynamic Page Content -->
        <div id="main-content" class="flex-1 p-6 overflow-y-auto custom-scrollbar">
            <!-- Pages will inject their HTML here -->
        </div>

        <!-- Global Loading Overlay -->
        <div id="loading-overlay" class="fixed inset-0 bg-slate-950/70 backdrop-blur-md z-50 hidden flex-col items-center justify-center">
            <div class="w-12 h-12 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin mb-4"></div>
            <p class="text-white font-medium text-sm tracking-wide">Procesando datos...</p>
        </div>

        <!-- Toast Container -->
        <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2.5"></div>
    </main>

    <!-- Scripts (Order is critical) -->
    <script src="js/firebase-config.js?v=6.2.323"></script>
    <script src="js/firebase-sync.js?v=6.2.323"></script>
    <script src="js/utils/helpers.js?v=6.2.323"></script>
    <script src="js/storage.js?v=6.2.323"></script>
    <script src="js/api.js?v=6.2.323"></script>
    <script src="js/pages/carga-datos.js?v=6.2.323"></script>
    <script src="js/pages/pizarra.js?v=6.2.323"></script>
    <script src="js/pages/viaticos-pensiones.js?v=6.2.323"></script>
    <script src="js/app.js?v=6.2.323"></script>
</body>
</html>
